# Nombre d'utilisateurs à générer
user.count=1000

# Fichier de sortie
output.file=output/users.csv

# Seed : renseigner un nombre pour obtenir le même jeu de données à chaque exécution
random.seed=

# Email (example.com est un domaine réservé aux tests, aucune adresse réelle)
email.domain=example.com

# Téléphone (06 39 98 xx xx : plage réservée par l'ARCEP aux œuvres de fiction)
phone.enabled=true
phone.prefix=063998

# Adresse (rue, ville, code postal)
address.enabled=true

# Date de naissance
birthdate.enabled=true
birthdate.minYear=1970
birthdate.maxYear=2005

# Genre
gender.enabled=true

# Mot de passe aléatoire (sinon Pass123 pour tous)
password.random=true
